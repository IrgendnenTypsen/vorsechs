[build]
  publish = "."
  functions = "netlify/functions"

# Update-Infos nie zwischenspeichern, sonst sehen Tester neue Versionen erst Stunden später
[[headers]]
  for = "/update/*.json"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/stats"
  to = "/stats.html"
  status = 200
