<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>vorsechs · Zahlen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root { --bg:#0F1626; --s:#172036; --line:#2A3654; --ink:#F2F2EF; --ink2:#9AA3B5; --a:#FFB22E; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 "Atkinson Hyperlegible", system-ui, sans-serif; }
.wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 60px; }
h1 { font: 800 34px "Bricolage Grotesque", sans-serif; letter-spacing: -.02em; margin: 0 0 4px; }
h2 { font: 800 22px "Bricolage Grotesque", sans-serif; margin: 30px 0 10px; }
.muted { color: var(--ink2); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 18px; }
.kpi { background: var(--s); border-radius: 16px; padding: 14px 16px; }
.kpi b { display: block; font: 800 34px "Bricolage Grotesque", sans-serif; color: var(--a); line-height: 1.1; }
.kpi span { font-size: 14px; color: var(--ink2); }
.card { background: var(--s); border-radius: 16px; padding: 16px; }
svg text { fill: var(--ink2); font-size: 11px; }
form { display: flex; gap: 8px; margin-top: 18px; }
input, button { font: inherit; border-radius: 12px; border: 1px solid var(--line); background: var(--s); color: var(--ink); padding: 12px 14px; }
button { background: var(--a); color: var(--bg); font-weight: 700; border: 0; cursor: pointer; }
.bar { display: grid; grid-template-columns: 180px 1fr 50px; gap: 10px; align-items: center; margin: 6px 0; font-size: 14px; }
.bar div { height: 14px; border-radius: 7px; background: var(--a); }
#err { color: #ff8a80; }
</style>
</head>
<body>
<div class="wrap">
  <h1>vorsechs · Zahlen</h1>
  <div class="muted">Anonyme Nutzung der App. Nur für dich – Passwort aus Netlify (STATS_KEY).</div>
  <form id="f"><input id="k" type="password" placeholder="Passwort" autocomplete="current-password" aria-label="Passwort"><button>Anzeigen</button></form>
  <p id="err"></p>
  <div id="out" hidden>
    <div class="kpis" id="kpis"></div>
    <h2>Aktive Nutzer pro Tag</h2><div class="card"><svg id="c1" width="100%" height="180" role="img" aria-label="Aktive Nutzer pro Tag"></svg></div>
    <h2>Downloads pro Tag</h2><div class="card"><svg id="c2" width="100%" height="140" role="img" aria-label="Downloads pro Tag"></svg></div>
    <h2>Umfragen</h2><div id="surveys" class="card"></div>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function bars(svg, days, val, color) {
  const W = svg.clientWidth || 900, H = +svg.getAttribute('height'), pad = 22, n = days.length;
  const max = Math.max(1, ...days.map(val)), bw = (W - pad) / n;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = days.map((d, i) => { const h = (val(d) / max) * (H - 2 * pad); return `<rect x="${pad + i * bw + 1}" y="${H - pad - h}" width="${Math.max(1, bw - 2)}" height="${h}" rx="2" fill="${color}"><title>${d.day}: ${val(d)}</title></rect>`; }).join('')
    + `<text x="0" y="${pad}">${max}</text><text x="${pad}" y="${H - 4}">${days[0].day.slice(5)}</text><text x="${W - 40}" y="${H - 4}">${days[n - 1].day.slice(5)}</text>`;
}
$('#f').onsubmit = async (e) => {
  e.preventDefault(); $('#err').textContent = '';
  const r = await fetch(`/api/stats?key=${encodeURIComponent($('#k').value)}`);
  const s = await r.json();
  if (!r.ok) { $('#err').textContent = s.error || 'Fehler'; return; }
  const d30 = s.days.slice(-30), sum = (f) => d30.reduce((a, d) => a + f(d), 0);
  const dl = (d) => Object.values(d.downloads || {}).reduce((a, b) => a + b, 0);
  const avgMin = sum((d) => d.opens) ? Math.round(sum((d) => d.secs) / sum((d) => d.opens) / 60) : 0;
  const k = [[s.installs, 'Installationen gesamt'], [sum(dl), 'Downloads (30 Tage)'], [s.wau, 'aktiv letzte 7 Tage'], [s.regular, 'Stammnutzer (≥3 Tage/Woche)'],
    [s.mau, 'aktiv letzte 30 Tage'], [`${avgMin} min`, 'Ø pro App-Öffnung'], [sum((d) => d.tours), 'Touren fertig (30 Tage)'], [sum((d) => d.stops), 'Adressen beliefert (30 Tage)']];
  $('#kpis').innerHTML = k.map(([v, l]) => `<div class="kpi"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('');
  $('#out').hidden = false;
  bars($('#c1'), s.days, (d) => d.active, '#FFB22E'); bars($('#c2'), s.days, dl, '#4DA3FF');
  const html = Object.entries(s.surveys || {}).map(([id, list]) => {
    const qs = {};
    list.forEach((r) => Object.entries(r.answers).forEach(([q, a]) => { (qs[q] ||= {})[a] = (qs[q][a] || 0) + 1; }));
    return `<b>${esc(id)}</b> · ${list.length} Antworten` + Object.entries(qs).map(([q, opts]) => { const tot = Object.values(opts).reduce((a, b) => a + b, 0);
      return `<p class="muted" style="margin:12px 0 4px">${esc(q)}</p>` + Object.entries(opts).sort((a, b) => b[1] - a[1]).map(([o, n]) => `<div class="bar"><span>${esc(o)}</span><div style="width:${(n / tot) * 100}%"></div><span>${Math.round((n / tot) * 100)} %</span></div>`).join(''); }).join('');
  }).join('<hr style="border-color:#2A3654">');
  $('#surveys').innerHTML = html || '<span class="muted">Noch keine Antworten.</span>';
};
</script>
</body>
</html>
